name: Get Deployment Info
description: Get deployment info from Astronomer API
inputs:
  deployment_id:
    description: The deployment ID
    required: true
  organization_id:
    description: The organization ID
    required: true
  astro_api_token:
    description: The Astronomer API token
    required: true
  astronomer_host:
    description: The Astronomer host
    required: true
  expected_status_code:
    description: The expected status code
    default: 200

outputs:
  desired_dag_tarball_version:
    description: The desired DAG tarball version
    value: ${{ steps.get-deployment-info.outputs.desired_dag_tarball_version }}
  desired_image_version:
    description: The image version
    value: ${{ steps.get-deployment-info.outputs.desired_image_version }}
  hibernation_spec:
    description: The hibernation spec
    value: ${{ steps.get-deployment-info.outputs.hibernation_spec }}

runs:
  using: "composite"
  steps:
    - name: Get Deployment Info
      id: get-deployment-info
      shell: bash
      env:
        DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        ORGANIZATION_ID: ${{ inputs.organization_id }}
        ASTRO_API_TOKEN: ${{ inputs.astro_api_token }}
        ASTRONOMER_HOST: ${{ inputs.astronomer_host }}
        EXPECTED_STATUS_CODE: ${{ inputs.expected_status_code }}
      run: |
        set -euo pipefail

        if [[ ! "$ASTRONOMER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]; then
          echo "Invalid Astronomer host format"
          exit 1
        fi
        if [[ ! "$ORGANIZATION_ID" =~ ^[A-Za-z0-9._-]+$ || ! "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid organization or deployment ID format"
          exit 1
        fi
        if [[ ! "$EXPECTED_STATUS_CODE" =~ ^[0-9]{3}$ ]]; then
          echo "Invalid expected status code"
          exit 1
        fi

        write_output() {
          local name="$1"
          local value="$2"
          local delimiter="ghadelim_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        rm -f response.json
        status_code="$({
          curl --silent --show-error --fail-with-body \
            --write-out '%{http_code}' \
            --output response.json \
            --header "Authorization: Bearer $ASTRO_API_TOKEN" \
            "https://api.$ASTRONOMER_HOST/v1alpha1/organizations/$ORGANIZATION_ID/deployments/$DEPLOYMENT_ID"
        } || true)"

        if [[ "$status_code" != "$EXPECTED_STATUS_CODE" ]]; then
          echo "Failed to get expected status code from GET Deployment API. Status code: $status_code"
          exit 1
        fi

        desired_dag_tarball_version=$(jq -er '.desiredDagTarballVersion' response.json)
        desired_image_version=$(jq -er '.desiredImageVersion' response.json)
        hibernation_spec=$(jq -ec '.scalingSpec.hibernationSpec' response.json)

        write_output "desired_dag_tarball_version" "$desired_dag_tarball_version"
        write_output "desired_image_version" "$desired_image_version"
        write_output "hibernation_spec" "$hibernation_spec"
