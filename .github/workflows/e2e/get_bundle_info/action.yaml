name: Get Deployment Bundle Info
description: Get deployment bundle info from Astronomer API
inputs:
  deployment_id:
    description: The deployment ID
    required: true
  organization_id:
    description: The organization ID
    required: true
  astro_api_token:
    description: The Astronomer API token
    required: true
  astronomer_host:
    description: The Astronomer host
    required: true
  expected_status_code:
    description: The expected status code
    default: 200

outputs:
  desired_bundle_version:
    description: The desired bundle version
    value: ${{ steps.get-deployment-info.outputs.desired_bundle_version }}
  bundle_type:
    description: The bundle type
    value: ${{ steps.get-deployment-info.outputs.bundle_type }}
  updated_at:
    description: The timestamp at which the bundle was last updated
    value: ${{ steps.get-deployment-info.outputs.updated_at }}

runs:
  using: "composite"
  steps:
    - name: Get Deployment Info
      id: get-deployment-info
      shell: bash
      env:
        DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        ORGANIZATION_ID: ${{ inputs.organization_id }}
        ASTRO_API_TOKEN: ${{ inputs.astro_api_token }}
        ASTRONOMER_HOST: ${{ inputs.astronomer_host }}
        EXPECTED_STATUS_CODE: ${{ inputs.expected_status_code }}
      run: |
        set -euo pipefail

        if [[ ! "$ASTRONOMER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]; then
          echo "Invalid Astronomer host format"
          exit 1
        fi
        if [[ ! "$ORGANIZATION_ID" =~ ^[A-Za-z0-9._-]+$ || ! "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid organization or deployment ID format"
          exit 1
        fi
        if [[ ! "$EXPECTED_STATUS_CODE" =~ ^[0-9]{3}$ ]]; then
          echo "Invalid expected status code"
          exit 1
        fi

        write_output() {
          local name="$1"
          local value="$2"
          local delimiter="ghadelim_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        rm -f response.json response_sorted.json
        status_code="$({
          curl --silent --show-error --fail-with-body \
            --write-out '%{http_code}' \
            --output response.json \
            --header "Authorization: Bearer $ASTRO_API_TOKEN" \
            "https://api.$ASTRONOMER_HOST/v1alpha1/organizations/$ORGANIZATION_ID/deployments/$DEPLOYMENT_ID/deploys"
        } || true)"

        if [[ "$status_code" != "$EXPECTED_STATUS_CODE" ]]; then
          echo "Failed to get expected status code from GET Deployment API. Status code: $status_code"
          exit 1
        fi

        if [[ "$(jq -er '.deploys | length' response.json)" -eq 0 ]]; then
          echo "No deploys found for the deployment"
          exit 1
        fi

        jq '.deploys | sort_by(.updatedAt)' response.json > response_sorted.json

        desired_bundle_version=$(jq -er '.[] | select(.type == "BUNDLE" and .bundles[0].bundleType == "dbt") | .bundles[0].desiredVersion' response_sorted.json | tail -n 1)
        bundle_type=$(jq -er '.[] | select(.type == "BUNDLE" and .bundles[0].bundleType == "dbt") | .bundles[0].bundleType' response_sorted.json | tail -n 1)
        updated_at=$(jq -er '.[] | select(.type == "BUNDLE" and .bundles[0].bundleType == "dbt") | .updatedAt' response_sorted.json | tail -n 1)

        write_output "desired_bundle_version" "$desired_bundle_version"
        write_output "bundle_type" "$bundle_type"
        write_output "updated_at" "$updated_at"
